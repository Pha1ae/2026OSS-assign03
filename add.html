<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a book | Bookshelf</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./my.css" rel="stylesheet">
    <script src="./app.js" defer></script>
</head>
<body data-page="add">
    <a class="visually-hidden-focusable skip-link" href="#main-content">Skip to content</a>
    <nav class="navbar bg-white border-bottom" aria-label="Main navigation">
        <div class="container page-width d-flex flex-wrap gap-2">
            <a class="navbar-brand fw-bold" href="./index.html">Bookshelf<span class="brand-dot">.</span></a>
            <div class="nav gap-1">
                <a class="nav-link " href="./index.html" >Library</a>
                <a class="nav-link active" href="./add.html" aria-current="page">Add book</a>
            </div>
        </div>
    </nav>
    <main id="main-content" class="container page-width py-4 py-md-5" tabindex="-1">
        <header class="page-header mb-4">
            <p class="eyebrow">YOUR PERSONAL LIBRARY</p>
            <h1>Add a book</h1>
            <p class="text-body-secondary mb-0">Give a new book a home in your collection.</p>
        </header>
        <div id="page-error" class="alert alert-danger" role="alert" hidden></div>
        <noscript><p class="alert alert-warning">Please enable JavaScript to use this library.</p></noscript>
        <section id="form-panel" class="card form-panel">
            <div class="card-body p-4 p-md-5">
                <h2 class="h5 mb-2">Book information</h2>
                <p class="small text-body-secondary mb-4">All six fields are required.</p>
                <p id="validation-summary" class="alert alert-danger" role="alert" hidden></p>
                <form id="book-form" class="row g-4" novalidate>
                <div class="col-12 col-md-6">
                    <label for="title" class="form-label">Book title <span aria-hidden="true">*</span></label>
                    <input id="title" name="title" type="text" class="form-control"
                        placeholder="e.g. The Quiet Garden" minlength="2" maxlength="100" required aria-describedby="title-error">
                    <div id="title-error" class="invalid-feedback"></div>
                    
                </div>
                <div class="col-12 col-md-6">
                    <label for="author" class="form-label">Author <span aria-hidden="true">*</span></label>
                    <input id="author" name="author" type="text" class="form-control"
                        placeholder="e.g. Avery Morgan" minlength="2" maxlength="60" required aria-describedby="author-error">
                    <div id="author-error" class="invalid-feedback"></div>
                    
                </div>
                <div class="col-12 col-md-6">
                    <label for="publisher" class="form-label">Publisher <span aria-hidden="true">*</span></label>
                    <input id="publisher" name="publisher" type="text" class="form-control"
                        placeholder="e.g. Willow Press" minlength="2" maxlength="80" required aria-describedby="publisher-error">
                    <div id="publisher-error" class="invalid-feedback"></div>
                    
                </div>
                <div class="col-12 col-md-6">
                    <label for="year" class="form-label">Publication year <span aria-hidden="true">*</span></label>
                    <input id="year" name="year" type="number" class="form-control"
                        placeholder="e.g. 2024" min="1450" step="1" required aria-describedby="year-error">
                    <div id="year-error" class="invalid-feedback"></div>
                    
                </div>
                <div class="col-12 col-md-6">
                    <label for="isbn" class="form-label">ISBN <span aria-hidden="true">*</span></label>
                    <input id="isbn" name="isbn" type="text" class="form-control"
                        placeholder="10 or 13 characters" maxlength="25" required aria-describedby="isbn-error isbn-help">
                    <div id="isbn-error" class="invalid-feedback"></div>
                    <p id="isbn-help" class="form-text">ISBN-10 or ISBN-13; spaces and hyphens are allowed.</p>
                </div>
                <div class="col-12 col-md-6">
                    <label for="category" class="form-label">Category <span aria-hidden="true">*</span></label>
                    <select id="category" name="category" class="form-select" required aria-describedby="category-error">
                        <option value="">Choose a category</option>
                        <option>Fiction</option>
                        <option>Technology</option>
                        <option>Science</option>
                        <option>History</option>
                        <option>Art</option>
                        <option>Other</option>
                    </select>
                    <div id="category-error" class="invalid-feedback"></div>
                </div>
                    <div class="col-12 d-flex flex-wrap gap-2 border-top pt-4 mt-4">
                        <button type="submit" class="btn btn-primary">Add book</button>
                        <a id="cancel-link" href="./index.html" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <footer class="container page-width site-footer">
        <span>Bookshelf · A place for your next read</span>
    </footer>
</body>
</html>
