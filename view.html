<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book details | Bookshelf</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="./my.css" rel="stylesheet">
    <script src="./app.js" defer></script>
</head>

<body data-page="view">
    <a class="visually-hidden-focusable skip-link" href="#main-content">Skip to content</a>
    <nav class="navbar bg-white border-bottom" aria-label="Main navigation">
        <div class="container page-width d-flex flex-wrap gap-2">
            <a class="navbar-brand fw-bold" href="./index.html">Bookshelf<span class="brand-dot">.</span></a>
            <div class="nav gap-1">
                <a class="nav-link " href="./index.html">Library</a>
                <a class="nav-link " href="./add.html">Add book</a>
            </div>
        </div>
    </nav>
    <main id="main-content" class="container page-width py-4 py-md-5" tabindex="-1">
        <header class="page-header mb-4">
            <p class="eyebrow">YOUR PERSONAL LIBRARY</p>
            <h1>Book details</h1>
            <p class="text-body-secondary mb-0">Everything you need to know about this title.</p>
        </header>
        <div id="page-error" class="alert alert-danger" role="alert" hidden></div>
        <noscript>
            <p class="alert alert-warning">Please enable JavaScript to use this library.</p>
        </noscript>
        <article id="detail-panel" class="card detail-panel" hidden>
            <header class="card-header p-4 bg-white">
                <span id="detail-category" class="badge category-badge mb-3"></span>
                <h2 id="detail-title" class="h3 mb-1"></h2>
                <p id="detail-author" class="text-body-secondary mb-0"></p>
            </header>
            <div class="card-body p-4">
                
                <dl id="book-details" class="row mb-0"></dl>
            </div>
            <footer class="card-footer bg-white p-4 d-flex flex-wrap gap-2">
                <a id="edit-link" href="./edit.html" class="btn btn-primary">Edit book</a>
                <button id="delete-button" type="button" class="btn btn-outline-danger">Delete book</button>
                <a href="./index.html" class="btn btn-outline-secondary ms-sm-auto">Back to library</a>
            </footer>
        </article>
    </main>
    <footer class="container page-width site-footer">
        <span>Bookshelf · A place for your next read</span>
    </footer>
</body>

</html>
